<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exam Review · Suri's Math</title>
<link rel="icon" href="favicon.svg" />
<link href="assets/fonts/fonts.css" rel="stylesheet" />
<link rel="stylesheet" href="assets/katex/katex.min.css" />
<link rel="stylesheet" href="exam-review.css" />
<script defer src="assets/katex/katex.min.js"></script>
<script defer src="assets/katex/auto-render.min.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to review</a>
<header class="topbar">
  <a href="review.html" class="back">Review archive</a>
  <div class="lang" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div>
</header>
<main id="main">
  <header class="exam-head"><p id="examDate" class="meta"></p><h1 id="examTitle"></h1><p id="examDiagnosis" class="diagnosis"></p></header>
  <section class="record" aria-labelledby="recordTitle">
    <div><p class="label" id="recordTitle">Attempt record</p><strong id="examScore"></strong></div>
    <dl id="scoreFacts"></dl><p class="next"><span>Next</span><b id="nextAction"></b></p>
  </section>
  <form id="scoreEditor" class="score-editor"><label>Correct<input id="editCorrect" type="number" min="0" max="25"></label><label>Wrong<input id="editWrong" type="number" min="0" max="25"></label><label>Blank<input id="editBlank" type="number" min="0" max="25"></label><output id="editScore"></output></form>
  <nav class="problem-nav" aria-label="Problem index"><span>Problems</span><div id="problemNav"></div></nav>
  <section class="problem-map" aria-labelledby="mapTitle"><h2 id="mapTitle">Problem map</h2><div id="problemMap"></div></section>
  <section aria-labelledby="reviewTitle"><div class="section-head"><h2 id="reviewTitle">Problem review</h2><p id="progressText"></p></div><div id="problems"></div></section>
  <section class="recheck" aria-labelledby="recheckTitle"><h2 id="recheckTitle">Recheck protocol</h2></section>
</main>
<footer><a href="review.html">All review records</a><a href="index.html">Math roadmap</a></footer>
<script src="review-data.js"></script>
<script src="{{DATA_FILE}}"></script>
<script src="exam-review.js"></script>
</body>
</html>
