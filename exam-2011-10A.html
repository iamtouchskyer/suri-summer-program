<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2011 AMC 10A · 真卷攻坚档案</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Noto+Serif+SC:wght@500;700;900&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --paper:#f4efe4; --paper-2:#efe8d8; --card:#fbf8f0;
  --ink:#2b2620; --ink-soft:#4a4136; --ink-faint:#6f6656; --line:#d8cdb5;
  --accent:#1d5c4f; --accent-2:#b5471f; --gold:#b8860b;
  --ok:#1d5c4f; --bad:#b5471f;
  --serif:'Fraunces','Noto Serif SC',serif;
  --sans:'Spline Sans','Noto Serif SC',sans-serif;
  --mono:'Spline Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;padding-bottom:70px;}
.wrap{max-width:860px;margin:0 auto;padding:0 20px;}
header{background:linear-gradient(165deg,#fbf8f0,#efe4cf);border-bottom:2px solid var(--line);padding:26px 0 22px;margin-bottom:24px;position:relative;}
.crumb{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
.crumb a{color:var(--accent);text-decoration:none;}
h1{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1.05;margin:6px 0 4px;}
.sub{color:var(--ink-faint);font-size:.92rem;}
.lang-toggle{position:absolute;top:22px;right:20px;display:flex;gap:4px;}
.lang-toggle button{font-family:var(--mono);font-size:.7rem;padding:4px 9px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;color:var(--ink-faint);}
.lang-toggle button.on{background:var(--accent);color:#fbf8f0;border-color:var(--accent);}

/* scorecard */
.scorecard{background:linear-gradient(120deg,#1d5c4f,#16463c);color:#f4efe4;border-radius:16px;padding:20px 24px;margin-bottom:24px;}
.scorecard h2{font-family:var(--serif);font-size:1.2rem;margin-bottom:12px;color:#fff;}
.score-row{display:flex;gap:8px;flex-wrap:wrap;}
.qchip{font-family:var(--mono);font-size:.8rem;font-weight:700;width:38px;height:38px;display:grid;place-items:center;border-radius:9px;position:relative;}
.qchip.correct{background:rgba(255,255,255,.18);color:#d6f0e5;}
.qchip.wrong{background:var(--accent-2);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25);}
.qchip small{position:absolute;bottom:-16px;left:0;right:0;font-size:.54rem;font-weight:400;opacity:.7;color:var(--ink-faint);}
.score-legend{margin-top:22px;font-size:.82rem;opacity:.9;display:flex;gap:18px;flex-wrap:wrap;}
.score-legend span{display:flex;align-items:center;gap:6px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.dot.g{background:rgba(255,255,255,.35);}.dot.r{background:var(--accent-2);}

/* section labels */
.row-label{display:flex;align-items:center;gap:14px;margin:34px 0 16px;}
.row-label h2{font-family:var(--serif);font-weight:700;font-size:1.35rem;white-space:nowrap;}
.row-label .rule{flex:1;height:1px;background:var(--line);}

/* problem card */
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:24px;margin-bottom:22px;}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
.pc-num{font-family:var(--serif);font-weight:900;font-size:1.6rem;color:var(--accent-2);}
.pc-topic{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);text-align:right;}
.pc-stem{font-size:1rem;line-height:1.75;margin-bottom:16px;}
.pc-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px;}
.pc-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);font-size:.92rem;}
.pc-opt .ol{font-family:var(--mono);font-weight:700;color:var(--accent);}
.pc-opt.ans{border-color:var(--ok);background:#e3efe8;}
.pc-opt.ans .ol{color:var(--ok);}

/* progressive reveal */
.reveal-box{margin-top:14px;}
.think-prompt{background:#fbf3e4;border:1.5px solid var(--gold);border-radius:11px;padding:13px 16px;font-size:.9rem;color:#7a5c12;margin-bottom:12px;}
.think-prompt b{color:#5c4409;}
.btn{font-family:var(--sans);font-weight:600;font-size:.88rem;padding:10px 20px;border-radius:9px;border:1.5px solid var(--accent);background:var(--accent);color:#fbf8f0;cursor:pointer;transition:all .15s;}
.btn:hover{background:#16463c;}
.btn.ghost{background:transparent;color:var(--accent);}
.btn.ghost:hover{background:#e8f0ec;}
.hidden{display:none !important;}

/* method tabs */
.method-tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap;}
.mtab{font-family:var(--mono);font-size:.76rem;padding:7px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;color:var(--ink-faint);transition:all .13s;}
.mtab.on{background:var(--accent);color:#fbf8f0;border-color:var(--accent);}
.method-body{background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:16px 18px;}
.method-name{font-family:var(--serif);font-weight:700;font-size:1.05rem;margin-bottom:10px;color:var(--accent);}
.method-steps{list-style:none;counter-reset:s;}
.method-steps li{counter-increment:s;position:relative;padding:7px 0 7px 34px;font-size:.92rem;border-top:1px solid var(--line-soft,#e6ddc9);line-height:1.7;}
.method-steps li:first-child{border-top:0;}
.method-steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;background:var(--accent);color:#fbf8f0;border-radius:50%;font-family:var(--mono);font-size:.72rem;font-weight:700;display:grid;place-items:center;}
.method-result{margin-top:10px;font-family:var(--mono);font-weight:700;font-size:.95rem;color:var(--accent-2);padding-top:10px;border-top:1.5px solid var(--line);}

/* tags */
.pc-tags{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pc-tags .tlabel{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;color:var(--ink-faint);}
.tag{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:6px;background:#e8f0ec;color:var(--accent);border:1px solid #b9d5cb;}

/* similar drills */
.sim-toggle{margin-top:14px;}
.sim-list{margin-top:12px;display:none;}
.sim-list.show{display:block;}
.sim-item{border-top:1px solid var(--line);padding:12px 0;font-size:.9rem;}
.sim-item:first-child{border-top:0;}
.sim-q{margin-bottom:4px;}
.sim-lvl{font-family:var(--mono);font-size:.66rem;color:var(--accent-2);text-transform:uppercase;letter-spacing:.04em;}
.sim-reveal{font-family:var(--mono);font-size:.72rem;color:var(--accent);cursor:pointer;user-select:none;}
.sim-ans{margin-top:6px;padding:8px 12px;background:var(--paper);border-radius:8px;font-size:.86rem;display:none;}
.sim-ans.show{display:block;}
.sim-ans b{color:var(--accent-2);}

.backlink{display:inline-block;margin:8px 0 0;font-family:var(--mono);font-size:.8rem;color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<style>
/* mock exam */
.mock-intro{background:linear-gradient(120deg,#fbf8f0,#f3e7d4);border:1.5px solid var(--accent-2);border-radius:16px;padding:22px 24px;margin-bottom:20px;}
.mock-intro h2{font-family:var(--serif);font-size:1.3rem;margin-bottom:8px;}
.mock-intro p{font-size:.9rem;color:var(--ink-soft);margin-bottom:14px;}
.mock-q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.mq-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.mq-tag{color:var(--accent-2);font-weight:700;}
.mq-stem{font-size:.96rem;line-height:1.7;margin-bottom:14px;}
.mq-opts{display:grid;gap:8px;}
.mq-opt{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;transition:all .12s;font-size:.92rem;}
.mq-opt:hover{border-color:var(--accent);background:#fff;}
.mq-opt.sel{border-color:var(--accent);background:#e8f0ec;}
.mq-opt.correct{border-color:var(--ok);background:#e3efe8;}
.mq-opt.wrong{border-color:var(--bad);background:#f6e6de;}
.mq-opt .mol{font-family:var(--mono);font-weight:700;color:var(--accent);min-width:18px;}
.mq-open{margin-top:12px;}
.mq-open input{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px;font-family:var(--mono);font-size:.95rem;background:var(--paper);}
.mq-open input:focus{outline:none;border-color:var(--accent);}
.mock-submit{margin-top:8px;}
.mock-result{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;margin-top:16px;}
.mock-scorebig{font-family:var(--serif);font-weight:900;font-size:2.6rem;color:var(--accent);line-height:1;}
.mr-line{font-size:.9rem;color:var(--ink-soft);margin-top:8px;}
.mq-verdict{font-family:var(--mono);font-size:.78rem;font-weight:700;margin-top:8px;}
.mq-verdict.ok{color:var(--ok);}.mq-verdict.bad{color:var(--bad);}
</style>

<header>
  <div class="wrap">
    <div class="lang-toggle">
      <button id="lang-zh" class="on" onclick="setLang('zh')">中文</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
    <div class="crumb"><a href="index.html">← Suri's Math</a> / <span data-i18n="crumb">真卷攻坚档案 Exam Archive</span></div>
    <h1 data-i18n="title">📄 2011 AMC 10A · 最后五题</h1>
    <div class="sub" data-i18n="sub">真卷错题 · 三种解法 · 举一反三 · 模拟验收 —— 把错的变成会的。</div>
  </div>
</header>

<div class="wrap">

  <!-- scorecard -->
  <div class="scorecard">
    <h2 data-i18n="scoretitle">📊 Suri 的战果 · Feb 8, 2011</h2>
    <div class="score-row" id="scoreRow"></div>
    <div class="score-legend">
      <span><i class="dot g"></i><span data-i18n="legendok">第 1-20 题 · 基本全对</span></span>
      <span><i class="dot r"></i><span data-i18n="legendbad">第 21-25 题 · 未做出（本页攻坚）</span></span>
    </div>
  </div>

  <!-- problems -->
  <div class="row-label"><h2 data-i18n="probstitle">五道压轴 · 逐题拆解</h2><span class="rule"></span></div>
  <div id="problems"></div>

  <!-- mock exam -->
  <div class="row-label"><h2 data-i18n="mocktitle">🎯 模拟验收考</h2><span class="rule"></span></div>
  <div id="mockSection"></div>

  <a class="backlink" href="index.html">← <span data-i18n="back">返回主页</span></a>

<script src="exam-2011-10A-data.js"></script>
<script>
let LANG='zh';
const I18N={
  crumb:{zh:'真卷攻坚档案 Exam Archive',en:'Exam Archive'},
  title:{zh:'📄 2011 AMC 10A · 最后五题',en:'📄 2011 AMC 10A · Last Five'},
  sub:{zh:'真卷错题 · 三种解法 · 举一反三 · 模拟验收 —— 把错的变成会的。',en:'Real misses · three methods each · twin drills · a mock exam — turn misses into mastery.'},
  scoretitle:{zh:'📊 Suri 的战果 · Feb 8, 2011',en:'📊 Suri result · Feb 8, 2011'},
  legendok:{zh:'第 1-20 题 · 基本全对',en:'Q1-20 · essentially all correct'},
  legendbad:{zh:'第 21-25 题 · 未做出（本页攻坚）',en:'Q21-25 · unsolved (tackled here)'},
  probstitle:{zh:'五道压轴 · 逐题拆解',en:'The five stumpers · broken down'},
  mocktitle:{zh:'🎯 模拟验收考',en:'🎯 Mock check-exam'},
  back:{zh:'返回主页',en:'Back home'},
  think:{zh:'先想 30 秒',en:'Think 30s first'},
  reveal:{zh:'看解法 →',en:'Reveal methods →'},
  showsim:{zh:'举一反三：10 道同类题 ↓',en:'Twin drills: 10 similar ↓'},
  hidesim:{zh:'收起同类题 ↑',en:'Hide similar ↑'},
  showans:{zh:'看答案',en:'answer'},
  trap:{zh:'陷阱 / 突破口',en:'Trap / breakthrough'},
  ans:{zh:'正确答案',en:'Answer'},
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderKatex(el){ if(window.renderMathInElement) renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\\\(',right:'\\\\)',display:false}],throwOnError:false}); }
function setLang(l){
  LANG=l;
  document.getElementById('lang-zh').classList.toggle('on',l==='zh');
  document.getElementById('lang-en').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[k])el.textContent=I18N[k][l];});
  renderAll();
}

const E = window.EXAM_2011_10A;

/* scorecard */
function renderScore(){
  const row=document.getElementById('scoreRow'); row.innerHTML='';
  for(let i=1;i<=25;i++){
    const wrong=(i>=21);
    const c=document.createElement('div');
    c.className='qchip '+(wrong?'wrong':'correct');
    c.innerHTML=i+(wrong?'<small>?</small>':'');
    row.appendChild(c);
  }
}

/* problems */
function renderProblems(){
  const host=document.getElementById('problems'); host.innerHTML='';
  E.problems.forEach((p,pi)=>{
    const card=document.createElement('div'); card.className='pcard';
    // options
    let optHtml='';
    Object.entries(p.options).forEach(([k,v])=>{
      const isAns=k===p.ans;
      optHtml+=`<div class="pc-opt${isAns?' ans':''}"><span class="ol">${k}</span><span>${esc(v)}</span></div>`;
    });
    // method tabs
    let tabHtml='', bodyHtml='';
    p.methods.forEach((m,mi)=>{
      tabHtml+=`<div class="mtab${mi===0?' on':''}" onclick="switchMethod(${pi},${mi})">${LANG==='zh'?'解法':'Method'} ${mi+1}</div>`;
    });
    const tags=(p.tags[LANG]||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
    card.innerHTML=`
      <div class="pc-head"><span class="pc-num">#${p.num}</span><span class="pc-topic">${esc(p.topic[LANG])}<br>${I18N.ans[LANG]}: <b>${p.ans}</b> = ${esc(p.ansValue)}</span></div>
      <div class="pc-stem">${esc(p.stem[LANG])}</div>
      <div class="pc-opts">${optHtml}</div>
      <div class="reveal-box">
        <div class="think-prompt"><b>💡 ${I18N.think[LANG]}.</b> ${esc(p.trap[LANG])}</div>
        <button class="btn" id="rvbtn-${pi}" onclick="revealMethods(${pi})">${I18N.reveal[LANG]}</button>
        <div class="methods-wrap hidden" id="mw-${pi}">
          <div class="method-tabs">${tabHtml}</div>
          <div class="method-body" id="mb-${pi}"></div>
          <div class="pc-tags"><span class="tlabel">${LANG==='zh'?'考点':'concepts'}</span>${tags}</div>
          <div class="sim-toggle"><button class="btn ghost" onclick="toggleSim(${pi})" id="simbtn-${pi}">${I18N.showsim[LANG]}</button></div>
          <div class="sim-list" id="sim-${pi}"></div>
        </div>
      </div>`;
    host.appendChild(card);
    renderMethod(pi,0);
    renderSim(pi);
    renderKatex(card);
  });
}
function revealMethods(pi){
  document.getElementById('rvbtn-'+pi).classList.add('hidden');
  document.getElementById('mw-'+pi).classList.remove('hidden');
}
let curMethod={};
function switchMethod(pi,mi){
  curMethod[pi]=mi;
  document.querySelectorAll('#mw-'+pi+' .mtab').forEach((t,i)=>t.classList.toggle('on',i===mi));
  renderMethod(pi,mi);
}
function renderMethod(pi,mi){
  const m=E.problems[pi].methods[mi];
  const body=document.getElementById('mb-'+pi); if(!body)return;
  let steps=m.steps.map(s=>`<li>${esc(s)}</li>`).join('');
  body.innerHTML=`<div class="method-name">${esc(m.name)}</div><ol class="method-steps">${steps}</ol><div class="method-result">${LANG==='zh'?'结果':'Result'} = ${esc(m.result)}</div>`;
  renderKatex(body);
}
function toggleSim(pi){
  const list=document.getElementById('sim-'+pi);
  const btn=document.getElementById('simbtn-'+pi);
  const show=!list.classList.contains('show');
  list.classList.toggle('show',show);
  btn.textContent = show?I18N.hidesim[LANG]:I18N.showsim[LANG];
}
function renderSim(pi){
  const list=document.getElementById('sim-'+pi); if(!list)return;
  const sims=E.problems[pi].similar;
  list.innerHTML=sims.map((s,si)=>`
    <div class="sim-item">
      <div class="sim-lvl">${esc(s.level)}</div>
      <div class="sim-q">${esc(s.q)}</div>
      <span class="sim-reveal" onclick="document.getElementById('sa-${pi}-${si}').classList.toggle('show')">${I18N.showans[LANG]} ▾</span>
      <div class="sim-ans" id="sa-${pi}-${si}"><b>${I18N.ans[LANG]}: ${esc(s.answer)}</b> — ${esc(s.sketch)}</div>
    </div>`).join('');
  renderKatex(list);
}

function renderAll(){ renderScore(); renderProblems(); renderMock(); }
window.addEventListener('DOMContentLoaded',renderAll);
</script>

<script>
/* ============ MOCK EXAM ============
   Combines the 5 original last-5 problems (multiple-choice) with
   selected similar drills (open-answer), to confirm mastery + transfer. */
function buildMockItems(){
  const items=[];
  // the 5 real problems (multiple choice)
  E.problems.forEach(p=>{
    items.push({kind:'mc', origin:p.num, tag:{zh:'原题 #'+p.num,en:'Original #'+p.num},
      stem:p.stem, options:p.options, ans:p.ans, topic:p.topic});
  });
  // one similar drill per problem (pick a mid-difficulty transfer), open-answer
  E.problems.forEach((p,pi)=>{
    const s=p.similar[Math.min(3,p.similar.length-1)]; // ~4th, mid-level
    items.push({kind:'open', origin:p.num, tag:{zh:'变式 #'+p.num,en:'Twin #'+p.num},
      stem:{zh:s.q,en:s.q}, ans:s.answer, sketch:s.sketch, topic:p.topic});
  });
  return items;
}
let MOCK=[], mockAnswers={}, mockSubmitted=false;
function normAns(s){ return String(s).replace(/\s+/g,'').replace(/\\/g,'').toLowerCase(); }
function renderMock(){
  const host=document.getElementById('mockSection'); if(!host)return;
  MOCK=buildMockItems(); mockAnswers={}; mockSubmitted=false;
  let html=`<div class="mock-intro">
      <h2>${LANG==='zh'?'把错的变成会的':'Turn misses into mastery'}</h2>
      <p>${LANG==='zh'?'这套模拟考 = 5 道原压轴题 + 5 道同类变式。原题确认你「真的会了」，变式确认你「能举一反三」。全部做完再交卷。':'This mock = the 5 original stumpers + 5 twin variants. Originals confirm you truly own it; twins confirm you can transfer. Answer all, then submit.'}</p>
    </div>
    <div id="mockItems"></div>
    <button class="btn mock-submit" onclick="submitMock()">${LANG==='zh'?'交卷 ✓':'Submit ✓'}</button>
    <div id="mockResult"></div>`;
  host.innerHTML=html;
  const mi=document.getElementById('mockItems');
  MOCK.forEach((it,idx)=>{
    const card=document.createElement('div'); card.className='mock-q';
    let body='';
    if(it.kind==='mc'){
      let opts='';
      Object.entries(it.options).forEach(([k,v])=>{
        opts+=`<div class="mq-opt" id="mo-${idx}-${k}" onclick="pickMock(${idx},'${k}')"><span class="mol">${k}</span><span>${esc(v)}</span></div>`;
      });
      body=`<div class="mq-opts">${opts}</div>`;
    } else {
      body=`<div class="mq-open"><input type="text" id="mopen-${idx}" placeholder="${LANG==='zh'?'输入答案（如 3120 或 15/19）':'your answer (e.g. 3120 or 15/19)'}" oninput="mockAnswers[${idx}]=this.value"></div>`;
    }
    card.innerHTML=`<div class="mq-head"><span class="mq-tag">${it.tag[LANG]}</span><span>${esc(it.topic[LANG])}</span></div>
      <div class="mq-stem">${esc(it.stem[LANG])}</div>${body}
      <div class="mq-verdict hidden" id="mv-${idx}"></div>`;
    mi.appendChild(card);
    renderKatex(card);
  });
}
function pickMock(idx,k){
  if(mockSubmitted)return;
  mockAnswers[idx]=k;
  MOCK[idx] && Object.keys(MOCK[idx].options).forEach(kk=>{
    document.getElementById('mo-'+idx+'-'+kk).classList.remove('sel');
  });
  document.getElementById('mo-'+idx+'-'+k).classList.add('sel');
}
function submitMock(){
  if(mockSubmitted)return; mockSubmitted=true;
  let correct=0;
  MOCK.forEach((it,idx)=>{
    const my=mockAnswers[idx];
    let ok=false;
    if(it.kind==='mc'){
      ok = my===it.ans;
      Object.keys(it.options).forEach(k=>{
        const el=document.getElementById('mo-'+idx+'-'+k);
        if(k===it.ans) el.classList.add('correct');
        if(k===my && my!==it.ans) el.classList.add('wrong');
      });
    } else {
      ok = my && normAns(my)===normAns(it.ans);
      const inp=document.getElementById('mopen-'+idx);
      if(inp){ inp.style.borderColor = ok?'var(--ok)':'var(--bad)'; inp.disabled=true; }
    }
    if(ok)correct++;
    const v=document.getElementById('mv-'+idx);
    v.classList.remove('hidden');
    v.className='mq-verdict '+(ok?'ok':'bad');
    let txt = ok ? (LANG==='zh'?'✓ 正确':'✓ correct')
                 : (LANG==='zh'?('✗ 正确答案: '+it.ans):('✗ answer: '+it.ans));
    if(!ok && it.kind==='open' && it.sketch) txt += ' — '+it.sketch;
    v.textContent=txt;
    renderKatex(v);
  });
  const pct=Math.round(correct/MOCK.length*100);
  const rb=document.getElementById('mockResult');
  let verdict = pct===100 ? (LANG==='zh'?'满分！错题全部拿下，举一反三也稳了。':'Perfect! Every miss reclaimed, transfer confirmed.')
    : pct>=70 ? (LANG==='zh'?'不错，但还有漏网之鱼 —— 回上面重看对应解法。':'Good, but a few leaked — revisit the methods above.')
    : (LANG==='zh'?'别灰心，这些是压轴级。回到上面逐题重走三种解法。':'Do not worry — these are last-5 level. Rewalk the three methods above.');
  rb.innerHTML=`<div class="mock-result">
    <div class="mock-scorebig">${correct}/${MOCK.length}</div>
    <div class="mr-line">${LANG==='zh'?'正确率':'accuracy'} ${pct}% · ${verdict}</div>
    <button class="btn ghost" style="margin-top:14px;" onclick="renderMock()">${LANG==='zh'?'再考一次':'Retake'}</button>
  </div>`;
  rb.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
