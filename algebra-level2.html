<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AwesomeMath Journal · Suri</title>
  <meta name="description" content="Suri 的 AwesomeMath 暑期数学日志 —— 知识点精讲、竞赛题逐题精解（中英双语）。" />
  <meta name="theme-color" content="#b5471f" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link href="assets/fonts/fonts.css" rel="stylesheet" />

  <link rel="stylesheet" href="assets/katex/katex.min.css" />
  <script defer src="assets/katex/katex.min.js"></script>
  <script defer src="assets/katex/auto-render.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
  <style id="a11y-fallback">
    /* 焦点可见性兜底（与 styles.css 一致），保证首屏前键盘焦点即可见 */
    a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid #c98a16; outline-offset: 2px;
    }
    /* 字体说明：Fraunces 为刻意选用的编辑衬线体，规避通用 AI 字体观感 */
  </style>
</head>
<body>
  <div class="grain"></div>

  <div class="reading-progress" id="readingProgress"></div>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-mark">∑</span>
        <div class="brand-text">
          <span class="brand-line1">AwesomeMath Journal</span>
          <span class="brand-line2">Algebra 2.5 · for Suri</span>
        </div>
      </div>
      <div class="masthead-right">
        <nav class="day-nav" id="dayNav"></nav>
        <div class="lang-toggle" id="langToggle"></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div class="kp-modal-layer" id="kpModalLayer"></div>

  <footer class="site-footer">
    <p>A living journal · updated every class · concepts → problems → solutions → insights</p>
  </footer>

  <button class="to-top" id="toTop" aria-label="回到顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script src="data.js"></script>
  <script src="day5.js"></script>
  <script src="day6.js"></script>
  <script src="day7.js"></script>
  <script src="day8.js"></script>
  <script src="day9.js"></script>
  <script src="textbook-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
