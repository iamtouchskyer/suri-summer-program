<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suri's Question Bank · 压轴题分级库</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Noto+Serif+SC:wght@500;700;900&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --paper:#f4efe4; --paper-2:#efe8d8; --card:#fbf8f0;
  --ink:#2b2620; --ink-faint:#6f6656; --line:#d8cdb5;
  --accent:#1d5c4f; --accent-2:#b5471f; --shadow:#d8cdb5;
  --gold:#b8860b;
  --serif:'Fraunces','Noto Serif SC',serif;
  --sans:'Spline Sans','Noto Serif SC',sans-serif;
  --mono:'Spline Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:60px;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px;}
header{background:linear-gradient(165deg,#fbf8f0,#efe4cf);border-bottom:2px solid var(--line);padding:26px 0 22px;margin-bottom:22px;}
header .wrap{display:flex;flex-direction:column;gap:6px;}
.crumb{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
.crumb a{color:var(--accent);text-decoration:none;}
h1{font-family:var(--serif);font-weight:900;font-size:1.9rem;line-height:1.05;}
.sub{color:var(--ink-faint);font-size:.9rem;}
.note{background:#fbf3e4;border:1.5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:.82rem;color:#7a5c12;margin-top:10px;}
/* controls */
.controls{position:sticky;top:0;z-index:20;background:var(--paper);padding:14px 0 12px;border-bottom:1.5px solid var(--line);margin-bottom:16px;}
.filter-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;align-items:center;}
.flabel{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-right:4px;min-width:42px;}
.chip{font-family:var(--mono);font-size:.76rem;padding:5px 11px;border:1.5px solid var(--line);border-radius:20px;background:var(--card);cursor:pointer;transition:all .15s;color:var(--ink-faint);user-select:none;}
.chip:hover{border-color:var(--ink);}
.chip.on{background:var(--accent);color:#fbf8f0;border-color:var(--accent);}
.chip.on.d-expert{background:var(--accent-2);border-color:var(--accent-2);}
.chip.on.d-olympiad{background:#7a2e12;border-color:#7a2e12;}
#q{width:100%;padding:9px 13px;border:1.5px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:.9rem;background:var(--card);color:var(--ink);}
#q:focus{outline:none;border-color:var(--accent);}
.count{font-family:var(--mono);font-size:.76rem;color:var(--ink-faint);margin-top:8px;}
.chip:focus-visible,.pq-ans-toggle:focus-visible,.more button:focus-visible,#q:focus-visible{outline:3px solid rgba(29,92,79,.28);outline-offset:2px;}
@media(max-width:600px){.controls{position:static}.wrap{padding:0 14px}.chip{padding:7px 10px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="crumb"><a href="index.html">← 总览</a> · QUESTION BANK</div>
    <h1>AMC / AIME 分级题库</h1>
    <div class="sub"><span id="bankTotal">—</span> 道 AMC/AIME 训练题 · 按阶段、知识点与难度筛选</div>
    <div class="note" id="bankNote">默认进入“压轴同类冲刺300”：52道真实21–25标杆题 + 248道同知识点、同思维结构的迁移训练题。全部1,259道可用题仍可切换。</div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="filter-row" id="stageRow">
      <span class="flabel">训练阶段</span>
    </div>
    <div class="filter-row" id="topicRow">
      <span class="flabel">知识点</span>
    </div>
    <div class="filter-row" id="bandRow">
      <span class="flabel">难度</span>
    </div>
    <div class="filter-row">
      <label class="flabel" for="q">搜索</label>
      <input id="q" type="search" placeholder="输入关键词，如 circle / probability / 内接 …" />
    </div>
    <div class="count" id="count" role="status" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</div>

<style>
.pcard-q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:12px;transition:border-color .15s;}
.pcard-q:hover{border-color:var(--ink);}
.pq-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.pq-id{font-family:var(--mono);font-size:.72rem;color:var(--ink-faint);}
.pq-tag{font-family:var(--mono);font-size:.66rem;padding:2px 8px;border-radius:12px;letter-spacing:.04em;}
.t-geometry{background:#e3efe9;color:#1d5c4f;}
.t-algebra{background:#eae7f5;color:#4b3f8f;}
.t-number{background:#f5ead9;color:#8a5a1a;}
.t-counting{background:#f3e2e2;color:#9a3a2a;}
.t-counting2{background:#efdcdc;color:#7a2e12;}
.pq-diff{font-family:var(--mono);font-size:.66rem;padding:2px 8px;border-radius:12px;background:var(--accent);color:#fbf8f0;}
.pq-diff.d-expert{background:var(--accent-2);}
.pq-diff.d-olympiad{background:#7a2e12;}
.pq-diff.d-hard{background:#5a7a1a;}
.pq-diff.d-mid{background:#7a6a4a;}
.pq-diff.d-easy{background:#9a9484;}
.pq-badge{font-family:var(--mono);font-size:.64rem;color:var(--ink-faint);border:1px solid var(--line);border-radius:10px;padding:1px 7px;}
.pq-text{font-size:.92rem;line-height:1.65;color:var(--ink);}
.pq-text .katex{font-size:1em;}
.empty{text-align:center;color:var(--ink-faint);padding:40px;font-family:var(--mono);font-size:.85rem;}
.more{text-align:center;margin:20px 0;}
.pq-ans-toggle{margin-top:11px;font-family:var(--mono);font-size:.72rem;padding:5px 13px;border:1.5px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent);cursor:pointer;transition:all .15s;}
.pq-ans-toggle:hover{background:var(--accent);color:#fbf8f0;}
.pq-ans-none{margin-top:11px;font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);font-style:italic;}
.pq-ans-box{margin-top:11px;padding:13px 15px;background:#f6f3ea;border:1px dashed var(--line);border-radius:9px;display:none;}
.pq-ans-box.open{display:block;}
.pq-ans-label{font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);letter-spacing:.05em;margin-bottom:6px;}
.pq-ans-val{font-size:1rem;font-weight:600;color:#1d5c4f;margin-bottom:9px;}
.pq-ans-tv{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:.6rem;padding:1px 7px;border-radius:9px;background:#1d5c4f;color:#fbf8f0;font-weight:400;}
.pq-ans-nr{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:.6rem;padding:1px 7px;border-radius:9px;background:#8a5a1a;color:#fbf8f0;font-weight:400;}
.pq-ans-opts{font-size:.85rem;line-height:1.7;color:var(--ink);margin-bottom:9px;}
.pq-sol{font-size:.85rem;line-height:1.7;color:var(--ink);white-space:pre-wrap;border-top:1px solid var(--line);padding-top:9px;}
.pq-sol .katex{font-size:.95em;}

.more button{font-family:var(--mono);font-size:.8rem;padding:9px 20px;border:1.5px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent);cursor:pointer;}
.more button:hover{background:var(--accent);color:#fbf8f0;}
</style>


<script src="qbank-data.js"></script>
<script src="sprint300-data.js"></script>
<script src="qbank-enhancements.js"></script>
<script>
var TOPICS = window.QBANK_TOPICS;
var DATA = window.QBANK || [];
var BANDS = [
  ['easy','入门 <2'], ['mid','中档 2-3'], ['hard','较难 3-4'],
  ['expert','难题 4-5'], ['olympiad','压轴 ≥5']
];
var state = { topics: [], bands: ['expert','olympiad'], q: '' };
var shown = 0;
var PAGE = 25;

function buildChips(){
  var tr = document.getElementById('topicRow');
  Object.keys(TOPICS).forEach(function(k){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.setAttribute('aria-pressed','false');
    c.textContent = TOPICS[k][1];
    c.dataset.k = k;
    c.onclick = function(){ toggle(state.topics, k, c); render(); };
    tr.appendChild(c);
  });
  var br = document.getElementById('bandRow');
  BANDS.forEach(function(b){
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip d-' + b[0];
    c.setAttribute('aria-pressed', state.bands.indexOf(b[0]) >= 0 ? 'true' : 'false');
    if (state.bands.indexOf(b[0]) >= 0) c.classList.add('on');
    c.textContent = b[1];
    c.dataset.k = b[0];
    c.onclick = function(){ toggle(state.bands, b[0], c); render(); };
    br.appendChild(c);
  });
}

function toggle(arr, k, el){
  var i = arr.indexOf(k);
  if (i >= 0){ arr.splice(i,1); el.classList.remove('on'); el.setAttribute('aria-pressed','false'); }
  else { arr.push(k); el.classList.add('on'); el.setAttribute('aria-pressed','true'); }
}

function match(p){
  if (state.topics.length && state.topics.indexOf(p.topic) < 0) return false;
  if (state.bands.length && state.bands.indexOf(p.band) < 0) return false;
  if (state.q){
    var q = state.q.toLowerCase();
    if (p.text.toLowerCase().indexOf(q) < 0 && p.id.indexOf(q) < 0) return false;
  }
  return true;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>


<script>
function cardHTML(p){
  var diffLabel = 'DIFF ' + p.diff.toFixed(p.diff % 1 === 0 ? 0 : 2);
  var badges = '';
  if (p.sprint){ badges += '<span class="pq-badge">' + esc(p.sprint.sprint_level) + '</span>'; badges += '<span class="pq-badge">' + esc(p.sprint.sprint_move) + '</span>'; if (p.sprint.is_benchmark) badges += '<span class="pq-badge">真实21–25</span>'; }
  if (p.img){ badges += '<span class="pq-badge">图</span>'; }
  if (p.mc){ badges += '<span class="pq-badge">选择题</span>'; }
  else { badges += '<span class="pq-badge">填空/证明</span>'; }
  var ansBlock = '';
  if (p.ans){
    var tvB = p.tv ? '<span class="pq-ans-tv">来源已核对</span>' : '';
    var nrB = p.nr ? '<span class="pq-ans-nr">待逐题校订</span>' : '';
    var optsHTML = '';
    if (p.options && typeof p.options === 'object'){
      var parts = [];
      for (var k in p.options){
        if (p.options.hasOwnProperty(k)){ parts.push('(' + k + ') ' + p.options[k]); }
      }
      optsHTML = '<div class="pq-ans-opts">' + esc(parts.join('  ')) + '</div>';
    }
    var solHTML = '';
  if (p.sol){
    if (typeof p.sol === 'string'){
      solHTML = '<div class="pq-sol">参考解析（待逐题校订）\n' + esc(p.sol) + '</div>';
    } else if (typeof p.sol === 'object'){
      var lines = [];
      var order = Object.keys(p.sol).sort(function(a,b){
        var na = parseInt((a.match(/\\d+/)||[999])[0],10);
        var nb = parseInt((b.match(/\\d+/)||[999])[0],10);
        if (a === 'final_answer') return 1;
        if (b === 'final_answer') return -1;
        return na - nb;
      });
      order.forEach(function(k){
        var label = (k === 'final_answer') ? '结论' : k.replace('step','步骤 ');
        lines.push(esc(label) + '：' + esc(String(p.sol[k])));
      });
      solHTML = '<div class="pq-sol">' + lines.join('\\n') + '</div>';
    }
  }
    ansBlock = '<button type="button" class="pq-ans-toggle" data-tid="' + p.id + '" aria-expanded="false" aria-controls="ans-' + p.id + '">显示答案</button>' +
      '<div class="pq-ans-box" id="ans-' + p.id + '">' +
        '<div class="pq-ans-label">ANSWER</div>' +
        '<div class="pq-ans-val">' + esc(String(p.ans)) + tvB + nrB + '</div>' +
        optsHTML + solHTML +
      '</div>';
  } else {
    ansBlock = '<div class="pq-ans-none">此题答案键异常，已隐藏并等待复核</div>';
  }
  return '<div class="pcard-q">' +
    '<div class="pq-head">' +
      '<span class="pq-tag t-' + p.topic + '">' + TOPICS[p.topic][1] + '</span>' +
      '<span class="pq-diff d-' + p.band + '">' + diffLabel + '</span>' +
      '<span class="pq-id">' + p.id + '</span>' + badges +
    '</div>' +
    '<div class="pq-text">' + esc(p.text) + '</div>' + ansBlock +
  '</div>';
}

function render(reset){
  if (reset !== false) shown = 0;
  var filtered = DATA.filter(match);
  var list = document.getElementById('list');
  var slice = filtered.slice(0, shown + PAGE);
  shown = slice.length;
  var html = slice.map(cardHTML).join('');
  if (!filtered.length) html = '<div class="empty">没有匹配的题目，试试放宽筛选条件。</div>';
  if (shown < filtered.length){
    html += '<div class="more"><button id="moreBtn">加载更多（还有 ' + (filtered.length - shown) + ' 题）</button></div>';
  }
  list.innerHTML = html;
  document.getElementById('count').textContent =
    '共 ' + filtered.length + ' 题匹配 · 显示 ' + shown + ' 题';
  if (window.renderMathInElement){
    renderMathInElement(list, {
      delimiters: [
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false},
        {left:'\\(',right:'\\)',display:false},
        {left:'\\[',right:'\\]',display:true}
      ],
      throwOnError: false
    });
  }
  var mb = document.getElementById('moreBtn');
  if (mb) mb.onclick = function(){ render(false); };
}

document.getElementById('q').addEventListener('input', function(e){
  state.q = e.target.value.trim();
  render();
});

function start(){ buildChips(); render(); }
if (document.readyState === 'complete') start();
else window.addEventListener('load', start);
</script>

<script>/*PQ_ANS_HOOK*/
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".pq-ans-toggle") : null;
  if(!b) return;
  var box = document.getElementById("ans-" + b.getAttribute("data-tid"));
  if(!box) return;
  var open = box.classList.toggle("open");
  b.textContent = open ? "隐藏答案" : "显示答案";
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
});
</script>
</body>
</html>
